<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title description">
  <title id="title">DinoGlobal-MIL v5 architecture</title>
  <desc id="description">A frozen DINOv3 encoder supplies fused layer-six and final patch features and a scene CLS vector. Three independent trainable attribute branches form relevance-weighted RR and RG evidence, then pool locally at top-k scales one, two, and four. Averaged scores and bounded scene residuals produce RR, RG, and NoR logits.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="#475569" />
    </marker>
  </defs>
  <rect width="1200" height="530" rx="16" fill="#ffffff" />
  <text x="30" y="38" class="title" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-weight="700" font-size="23">DinoGlobal-MIL · scene-conditioned local evidence</text>
  <rect x="22" y="78" width="292" height="203" rx="14" fill="#eff6ff" stroke="#93c5fd" />
  <text x="42" y="104" class="label" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-weight="700" font-size="16">Frozen encoder</text>
  <rect x="50" y="122" width="238" height="56" rx="8" fill="#fff" stroke="#94a3b8" />
  <text x="169" y="145" text-anchor="middle" class="label" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-weight="700" font-size="16">RGB image · 720 × 1280</text>
  <text x="169" y="165" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="13">ImageNet normalization</text>
  <path d="M169 178 V198" class="line" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="50" y="200" width="238" height="69" rx="8" fill="#dbeafe" stroke="#60a5fa" />
  <text x="169" y="225" text-anchor="middle" class="label" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-weight="700" font-size="16">DINOv3 ViT-S+/16</text>
  <text x="169" y="246" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="13">384 dimensions · layer 6 + final</text>
  <path d="M169 269 V290" class="line" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="50" y="292" width="238" height="108" rx="8" fill="#dcfce7" stroke="#4ade80" />
  <text x="169" y="317" text-anchor="middle" class="label" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-weight="700" font-size="15">Trainable fusion projection</text>
  <text x="169" y="340" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="13">[final; layer 6] → 768 → 192 + LN</text>
  <text x="169" y="364" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="13">3,600 patch vectors h · one CLS g</text>
  <text x="169" y="385" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="13">Four register tokens discarded</text>
  <rect x="340" y="78" width="543" height="350" rx="14" fill="#f0fdf4" stroke="#86efac" />
  <text x="360" y="104" class="label" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-weight="700" font-size="16">Trainable MIL head · three independent branches</text>
  <path d="M288 340 H338 V150 H362" class="line" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="365" y="122" width="245" height="61" rx="8" fill="#dcfce7" stroke="#4ade80" />
  <text x="487" y="146" text-anchor="middle" class="label" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-weight="700" font-size="16">Branch MLP · 192 → 192 → 192</text>
  <text x="487" y="168" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="13">GELU · dropout 0.2</text>
  <path d="M487 183 V200" class="line" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="365" y="202" width="245" height="75" rx="8" fill="#fff" stroke="#94a3b8" />
  <text x="487" y="226" text-anchor="middle" class="label" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-weight="700" font-size="14.8">Lamp · state · direction · relevance</text>
  <text x="487" y="247" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="10.9">Relevance sees g, position, geometry, direction</text>
  <text x="487" y="266" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="13">Attribute supervision during training</text>
  <path d="M610 239 H636" class="line" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="639" y="202" width="216" height="75" rx="8" fill="#fff7ed" stroke="#fb923c" />
  <text x="747" y="226" text-anchor="middle" class="label" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-weight="700" font-size="16">RR / RG evidence</text>
  <text x="747" y="248" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="13">lamp × relevance × state probability</text>
  <text x="747" y="267" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="13">45 × 80 spatial grid</text>
  <path d="M747 277 V296" class="line" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="639" y="299" width="216" height="87" rx="8" fill="#ffedd5" stroke="#fb923c" />
  <text x="747" y="323" text-anchor="middle" class="label" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-weight="700" font-size="16">Local multi-scale pooling</text>
  <text x="747" y="344" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="13">5 × 5 lamp-weighted mean</text>
  <text x="747" y="364" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="13">Branch top-k: 1, 2, 4 → average</text>
  <text x="747" y="380" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="13">s = [RR evidence, RG evidence]</text>
  <path d="M288 370 H328 V456 H928 V288" class="context" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4" />
  <path d="M487 456 V280" class="context" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4" />
  <text x="353" y="448" class="small" fill="#152238" font-family="Arial, Helvetica, sans-serif" font-size="13">CLS scene g · per-image dropout 0.3 during training</text>
  <rect x="911" y="122" width="267" height="288" rx="14" fill="#faf5ff" stroke="#c4b5fd" />
  <text x="1044" y="148" text-anchor="middle" class="label" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-weight="700" font-size="16">Image classification</text>
  <path d="M855 343 H900 V209 H933" class="line" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="936" y="171" width="217" height="70" rx="8" fill="#fff" stroke="#a78bfa" />
  <text x="1044" y="195" text-anchor="middle" class="label" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-weight="700" font-size="16">RR / RG logits</text>
  <text x="1044" y="216" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="13">a × s + b + 0.5 tanh(CLS MLP)</text>
  <path d="M900 343 V278 H933" class="line" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="936" y="254" width="217" height="72" rx="8" fill="#fff" stroke="#a78bfa" />
  <text x="1044" y="278" text-anchor="middle" class="label" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-weight="700" font-size="16">NoR logit</text>
  <text x="1044" y="299" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="11.0">Evidence base + bounded scene residual</text>
  <text x="1044" y="317" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="13">f([0;s]) + 0.5 tanh(f([g;s]) − f([0;s]))</text>
  <path d="M1044 326 V345" class="line" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1044" y="369" text-anchor="middle" class="label" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-weight="700" font-size="16">Softmax → RR / RG / NoR</text>
  <text x="1044" y="391" text-anchor="middle" class="small" font-family="Arial, Helvetica, sans-serif" fill="#152238" font-size="13">Image pixels only at inference</text>
  <path d="M928 288 V221 H934" class="context" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)" />
  <path d="M928 288 H934" class="context" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)" />
  <text x="30" y="496" class="note" font-family="Arial, Helvetica, sans-serif" fill="#475569" font-size="14">28,692,864 frozen encoder parameters · 489,475 trainable head parameters · EMA for inference</text>
</svg>