[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dinoglobal-mil"
version = "1.0.0"
description = "Frozen DINOv3 and scene-conditioned MIL for traffic-light relevance classification"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.7,<3",
    "transformers>=5.6,<6",
    "huggingface-hub>=1.0,<2",
    "numpy>=1.26",
    "Pillow>=10",
    "PyYAML>=6",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.12"]
preprocessing = ["opencv-python>=4.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["F"]
