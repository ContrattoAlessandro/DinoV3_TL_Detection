# dinov3_global v3 - fixes for the measured exp2 NoR failure.
# Every change below is justified by CONTEXT_v3.md section 4 (measured on val
# with scripts/diagnose.py). base.yaml is left untouched so exp2 stays
# reproducible from its checkpoint config.
data:
  label_dir: "datasets/DTLD/v2.0"
  img_root: "datasets/DTLD_1280"
  crop_sides: 0
  label_crop_sides: 114
  target_hw: [720, 1280]
  global_classes: ["RR", "RG", "NoR"]
  val_frac: 0.15
  val_seed: 0
  # P0-3: pseudo-NoR frames (NoR only because the relevant lamp is off/unknown)
  # are 33% of NoR and had AP 0.042 vs 0.115 for clean NoR, yet v2 downweighted
  # them to 0.3 while AP_NoR counts them fully. Train them at full weight.
  label_policy: "map_to_nor"      # map_to_nor | downweight | exclude
  policy_weight: 1.0
  # P0-4: class rebalancing. The class share is freq**(1-p) normalised, so it
  # depends on the class SIZES. Measured on the real train histogram
  # (natural 33.5/61.6/5.0%): pow025 -> NoR 8.5% (barely rebalances),
  # sqrt -> 14.1%, pow075 -> 22.3% (chosen), pow100 -> 33.3%.
  # tau_la is lowered in lockstep so the two mechanisms do not double-correct.
  sampler: "pow075"               # none | pow025 | pow050 | pow075 | pow100 | sqrt

backbone:
  hf_id: "facebook/dinov3-vits16plus-pretrain-lvd1689m"
  local_ckpt: null
  dim: 384
  patch: 16
  frozen: true
  use_cls: true
  attn_implementation: "sdpa"
  dtype: "float16"

decoder:
  head: "mil"
  proj_dim: 256
  dropout: 0.1
  # P1-1: top-k mean pooling (k = 1, 2, 4) replaces log-sum-exp pooling. In v2 the
  # -log N term penalised sparse evidence (0.245 at tau=0.030 but 1.823 at the
  # learned tau=0.223), which made one branch near-constant and halved the
  # evidence scale. "lse" stays available for the exp2 ablation.
  pool: "topk"                    # topk | lse
  topk: [1, 2, 4]
  n_branches: 2                   # only used by pool: lse
  tau_init: [0.05, 0.3]           # only used by pool: lse
  logit_scale: 2.5                # top-k scores use the full [0,1] range, so the
                                  # initial gain is smaller than v2's 4.0 to avoid
                                  # a saturated softmax at step 0
  # P1-2(b): the NoR MLP sees the pooled evidence [S_RR, S_RG] in addition to
  # the projected CLS token. "No relevant lamp" is by definition the complement
  # of the two evidence channels; jointly trained (unlike the post-hoc probe in
  # CONTEXT_v3.md 4.3, which scored 0.088) the head can learn how much to trust
  # them. Leave false for exp2-checkpoint compatibility (input dim changes).
  nor_sees_evidence: true
  # --- attn head (legacy only) ---
  depth: 2
  heads: 4
  ff_dim: 1024
  n_queries: 1

optim:
  seed: 0
  lr: 1.0e-4
  weight_decay: 0.05
  epochs: 30                      # full schedule; gates at ep5 / ep10 (see below)
  batch: 4
  accum: 4
  warmup_epochs: 3
  amp: true
  grad_clip: 1.0
  ema_decay: 0.999
  early_stop_metric: "mAP"
  early_stop_patience: 8          # P1-3: decided by val data, not by impatience

loss:
  label_smoothing: 0.05
  # P0-4: logit adjustment is kept (Fisher-consistent for acc_bal) but weakened
  # because pow025 sampling already addresses the 4.98% NoR prevalence.
  tau_la: 0.35                    # log pi = [-1.094, -0.486, -3.000]
  token_lamp: 0.3
  token_state: 0.2
  # P0-2: relevance is now supervised on ALL valid tokens (background = explicit
  # negative), so it needs more weight and a pos_weight to stay balanced
  # (relevant tokens are ~0.13% of valid tokens).
  token_rel: 0.5
  lamp_pos_weight: 10.0
  rel_pos_weight: 100.0
  consist: 0.1

augment:
  photometric: true
  blur: true
  strength: 1.0
  # P2-1 (promoted): manufactured "empty road" NoR frames. DTLD contains ZERO
  # lamp-free frames, so the most common case on foreign datasets is unlearned.
  # With p_erase per frame every lamp is painted out (normalized-convolution
  # fill, no black-box artifact) and the frame is relabelled NoR - honest by
  # the label definition ("2 = no relevant lamp present"). Token targets follow
  # the pixels (lamp/rel -> 0). Applied to non-NoR frames only; combined with
  # pow075 this keeps the effective NoR batch share at ~27% (22.3% sampled
  # NoR + ~4.7% manufactured) - RR/RG keep 73% of the mass.
  p_erase: 0.06

loader:
  num_workers: 0
  pin_memory: false

eval:
  split: "test"

# ---------------------------------------------------------------------------
# Decision gates (val only - never look at test to make these calls):
#   ep5 : AP_NoR >= 0.20 and rising        -> the P0 fixes are working, continue
#   ep10: AP_NoR <  0.15                    -> stop, escalate to the lamp-erasure
#                                             augmentation (CONTEXT_v3.md P2-1)
#   ep20+: val mAP >= 0.70                  -> run the one-shot test evaluation
# Stop the run only on val evidence, never on test.
# ---------------------------------------------------------------------------
