# dinov3_global v4 - attacks the MEASURED token-evidence failure directly.
#
# Facts behind every change (measured; see DECISIONS_v4.md for the full log):
#   F1  The whole benchmark gap is AP_NoR (exp3 test: RR 89.1 / RG 93.1 /
#       NoR 15.8 -> mAP 66.0 vs Trinci 81.5).
#   F2  Lamp geometry @720p: median 19x5.6 px, 39% < 16 px, ~2.4 patch tokens
#       per lamp, ~7 lamps/frame (~17 lamp tokens) - patch-16 features barely
#       resolve the lamp glass/housing.
#   F3  Relevance is largely a function of housing direction (DTLD train split,
#       200k lamps): P(rel|back) = 0.000, P(rel|left) = 0.043,
#       P(rel|right) = 0.040, P(rel|front) = 0.426. The rel head never saw it.
#   F4  Irrelevant lamps are visually LIT: 27% red, 23% green, 37% unknown.
#       Suppressing them is entirely the rel head's job.
#   F5  Extreme-value effect: frame evidence is a max over ~17 lamp tokens;
#       even a 90%-accurate token estimate fires on 1-0.9^17 = 84% of frames.
#       Aggregation must average a lamp's tokens BEFORE the max.
#
# exp3 changes kept as-is: label_policy map_to_nor, sampler pow075 + tau_la
# 0.35 in lockstep, top-k-style pooling, nor_sees_evidence, p_erase 0.06.
data:
  label_dir: "datasets/DTLD/v2.0"
  img_root: "datasets/DTLD_1280"
  crop_sides: 0
  label_crop_sides: 114
  target_hw: [720, 1280]
  global_classes: ["RR", "RG", "NoR"]
  val_frac: 0.15
  val_seed: 0
  label_policy: "map_to_nor"      # validated in exp3 (+2.9 AP_NoR vs downweight)
  policy_weight: 1.0
  sampler: "pow075"               # NoR 5.0% -> 22.3% of batches

backbone:
  hf_id: "facebook/dinov3-vits16plus-pretrain-lvd1689m"
  local_ckpt: null
  dim: 384
  patch: 16
  frozen: true
  use_cls: true
  attn_implementation: "sdpa"
  dtype: "float16"
  # F2: fuse mid-layer features with the final layer. The final layer is
  # semantic; lamp-glass state (off vs red) and housing orientation live in
  # mid-layer detail. layer index into hidden_states (embeddings + per layer),
  # so 6 = middle of ViT-S's 12 layers. null disables (exp2/exp3 behaviour).
  mid_layer: 6

decoder:
  head: "mil"
  proj_dim: 256
  dropout: 0.1
  # F5: "local" pools the evidence over a 5x5 lampness-weighted window before
  # top-k - i.e. per-lamp evidence instead of per-token. No dilution for
  # single-token lamps (weights normalise by the lampness mass).
  pool: "local"                   # topk | lse | local
  topk: [1, 2, 4]
  n_branches: 2                   # only used by pool: lse
  tau_init: [0.05, 0.3]           # only used by pool: lse
  logit_scale: 2.5
  nor_sees_evidence: true
  # F3: housing-direction aux head; its posterior feeds the rel head.
  dir_head: true
  # which-lamp-is-ego's-lane is scene geometry - give the evidence classes the
  # same CLS context the NoR head has had since exp2.
  cls_modulates_evidence: true
  # --- attn head (legacy only) ---
  depth: 2
  heads: 4
  ff_dim: 1024
  n_queries: 1

optim:
  seed: 0
  # exp3 peaked at ep5 and sagged (AP_NoR 0.187 -> 0.146 by ep13): gentler LR,
  # longer warm-up, longer schedule, patience so the tail is reached.
  lr: 6.0e-5
  weight_decay: 0.05
  epochs: 40
  batch: 4
  accum: 4
  warmup_epochs: 4
  amp: true
  grad_clip: 1.0
  ema_decay: 0.999
  early_stop_metric: "mAP"
  early_stop_patience: 12

loss:
  label_smoothing: 0.05
  tau_la: 0.35
  token_lamp: 0.3
  token_state: 0.2
  token_rel: 0.5
  token_dir: 0.2                  # F3: direction aux weight
  lamp_pos_weight: 10.0
  # F4/F5: focal modulation replaces the plain BCE so the ~3,500 trivial
  # background negatives per frame stop swamping the hard negatives
  # (irrelevant-but-lit lamps). pos_weight lowered accordingly (100 pushed the
  # head to over-fire, the measured failure mode).
  rel_pos_weight: 20.0
  rel_focal_gamma: 2.0
  # pseudo-NoR: the state confusion (relevant lamp off/unknown read as red)
  # is what manufactures evidence on the hardest 33% of NoR frames. Balance
  # the state CE (inverse-sqrt frequency) and up-weight relevant lamp tokens.
  state_balance: "sqrt"
  state_rel_boost: 2.0
  consist: 0.1

augment:
  photometric: true
  blur: true
  strength: 1.0
  p_erase: 0.06                   # manufactured lamp-free NoR (kept from v3)

loader:
  num_workers: 0
  pin_memory: false

eval:
  split: "test"

# ---------------------------------------------------------------------------
# Decision gates (val only - never look at test to make these calls):
#   ep5 : AP_NoR >= 0.20 and rising   -> v4 fixes are working (exp3: 0.183)
#   ep10: AP_NoR <  0.15               -> stop; escalate to instance-level MIL
#                                         (grid_sample lamp crops) or ViT-B+
#   ep20+: val mAP >= 0.70             -> run the one-shot test evaluation
# Stop the run only on val evidence, never on test.
# ---------------------------------------------------------------------------
