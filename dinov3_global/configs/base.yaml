# dinov3_global v2 (DinoGlobal-MIL) - frozen DINOv3 ViT-S+/16 + token-level MIL
# head, global RR/RG/NoR on DTLD. Tuned for RTX 5070 12GB, 1280x720, sdpa fp16.
data:
  label_dir: "datasets/DTLD/v2.0"      # holds DTLD_train.json / DTLD_test.json
  img_root: "datasets/DTLD_1280"       # offline dump (2048->1280 baked in); fallback: datasets/DTLD_jpg
  # 16:9 crop from 2048x1024 (2:1) -> 1820x1024, then resize to target_hw.
  crop_sides: 0                        # 0 with the DTLD_1280 dump (pre-cropped); 114 with raw DTLD_jpg
  label_crop_sides: 114                # crop BAKED INTO the image dump -> label->pixel mapping
  target_hw: [720, 1280]               # [H, W]; patch grid 45x80 = 3600 tokens
  global_classes: ["RR", "RG", "NoR"]  # 0=RR (red/yellow/red_yellow relevant), 1=RG, 2=NoR
  val_frac: 0.15                       # val carved session-disjoint from official train
  val_seed: 0                          # deterministic; test split stays held-out until final eval
  # pseudo-NoR = frames that are NoR only because their relevant lamps are
  # off/unknown (label ambiguity). "downweight" is the generalisation-friendly
  # default; options: map_to_nor | downweight | exclude
  label_policy: "downweight"
  policy_weight: 0.3
  sampler: "none"                      # none | sqrt (sqrt = mild NoR oversampling)

backbone:
  hf_id: "facebook/dinov3-vits16plus-pretrain-lvd1689m"   # ViT-S+/16, 29M, dim 384
  local_ckpt: null                   # set to local dir to skip HF login after manual download
  dim: 384
  patch: 16
  frozen: true
  use_cls: true
  attn_implementation: "sdpa"          # flash/sdpa required at 3600 tokens on 12GB
  dtype: "float16"                     # fp16 weights on cuda; fp32 on cpu

decoder:
  head: "mil"                          # mil (v2, default) | attn (legacy exp1 ablation)
  proj_dim: 256
  dropout: 0.1
  # --- mil head ---
  n_branches: 2                        # averaged branches resist single-token collapse
  tau_init: [0.05, 0.3]                # smooth-max sharpness per branch (learnable)
  logit_scale: 4.0                     # init gain for bounded evidence vs free NoR logit
  # --- attn head (legacy only) ---
  depth: 2
  heads: 4
  ff_dim: 1024
  n_queries: 1

optim:
  seed: 0
  lr: 1.0e-4
  weight_decay: 0.05
  epochs: 30
  batch: 4                             # 12GB-safe at 1280x720 ViT-S+ fp16+sdpa (2 views)
  accum: 4                             # eff batch 16
  warmup_epochs: 3
  amp: true
  grad_clip: 1.0
  ema_decay: 0.999
  early_stop_metric: "mAP"             # save best.pt on val mAP

loss:
  label_smoothing: 0.05
  tau_la: 1.0                          # logit adjustment (Menon et al.); 0 disables
  token_lamp: 0.3                      # aux: lampness BCE (DTLD boxes, train-only)
  token_state: 0.2                     # aux: state CE on lamp tokens
  token_rel: 0.2                       # aux: relevance BCE on lamp tokens
  lamp_pos_weight: 10.0
  consist: 0.1                         # two-view KL (0 disables)

augment:
  photometric: true
  blur: true
  strength: 1.0

loader:
  num_workers: 0                       # 0 = stable on this Windows host; use 4 on Linux
  pin_memory: false                    # true only with num_workers>0

eval:
  split: "test"
